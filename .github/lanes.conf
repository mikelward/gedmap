# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# The lane's test is "can this change what CI validates?". Markdown is docs
# wherever it lives OUTSIDE the shipped trees — prose cannot change a build —
# while anything under src/ or public/ is a build input whatever its
# extension (Vite can import any file, and public/ ships verbatim).
# Everything else is code — including .gitignore: ignore rules can hide
# files from CI's own staging steps.
code src/**
code public/**
docs **/*.md

# The subject prefixes a commit on this lane must carry, so nothing here can
# ever read like a bare behavior-change subject. Only the two of AGENTS.md's
# housekeeping prefixes that a lane diff can actually earn: every file this
# lane admits is markdown, so docs: and a todo:-only TODO.md edit are the
# whole set. deps: moves the manifests, test: moves tests, build: moves
# toolchain or CI config, refactor: moves code — each of those carries a
# non-markdown path and rides the code lane. Accepting them here would have
# the required gate blessing subjects describing work the diff cannot
# contain.
prefixes docs todo

# This repo's workflow_dispatch has one caller — the weekly dependency job's
# publish step, which opens the PR first precisely so its dispatch can name
# it — so a PR-less dispatch is never legitimate, on any ref.
dispatch-without-pr refuse
