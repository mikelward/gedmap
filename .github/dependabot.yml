version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "@eslint-community/*"
          - "eslint-plugin-*"
          - "eslint-config-*"
