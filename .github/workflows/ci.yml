name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The weekly dependency PR is opened by `GITHUB_TOKEN`, and GitHub does not
  # let a `GITHUB_TOKEN`-created event start a workflow — so `pull_request`
  # never fires for it. `workflow_dispatch` is the documented exception, and
  # `dependency-update.yml` dispatches this workflow against the branch it
  # pushes. Removing this leaves that PR with no CI and nothing to say so.
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Read the major from .nvmrc rather than repeating it here, so CI,
          # `nvm use`, and engines.node can't drift apart (nodeVersion.test.js
          # asserts the last pair agree).
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
