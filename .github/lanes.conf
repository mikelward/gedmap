# Ordered: the FIRST matching rule wins, and anything matching no rule is code.
#
# The lane's test is "can this change what CI validates?". Prose cannot
# change a build, but being prose is a matter of WHERE a file lives, not of
# its extension: markdown is docs at the root and under docs/, and code
# anywhere else. Anything under src/ or public/ is a build input whatever
# its extension (Vite can import any file, and public/ ships verbatim), and
# markdown in some future tree could be one too — which is why the docs
# rules below name their trees rather than matching *.md at any depth.
# Everything else is code — including .gitignore: ignore rules can hide
# files from CI's own staging steps.
code src/**
code public/**
# Root markdown and the docs/ tree only. The asymmetry is deliberate: `*.md`
# does not cross `/`, so it reaches the root and no further, while
# `docs/**/*.md` does, so it reaches every depth below docs/ and nowhere else.
# Writing the tree rule `docs/*.md` looks tidier and is a trap -- it puts a
# file one level down on the code lane. A bare `**/*.md` is the opposite
# mistake: it makes a markdown build input documentation at any depth.
docs *.md
docs docs/**/*.md

# The subject prefixes a commit on this lane must carry, so nothing here can
# ever read like a bare behavior-change subject. Only the two of AGENTS.md's
# housekeeping prefixes that a lane diff can actually earn: every file this
# lane admits is markdown, so docs: and a todo:-only TODO.md edit are the
# whole set. deps: moves the manifests, test: moves tests, build: moves
# toolchain or CI config, refactor: moves code — each of those carries a
# non-markdown path and rides the code lane. Accepting them here would have
# the required gate blessing subjects describing work the diff cannot
# contain.
prefixes docs todo

# Classify a push to main by the range it added, rather than by a paths
# filter on the trigger that would restate these rules in a second language.
# The heavy job is already gated on `docs_only`, so a docs-only push starts
# one short classify job and skips everything inside it.
push classify

# This repo's workflow_dispatch has one caller — the weekly dependency job's
# publish step, which opens the PR first precisely so its dispatch can name
# it — so a PR-less dispatch is never legitimate, on any ref.
dispatch-without-pr refuse

# The pull request title is never linted. Squash merging is disabled on every
# repository in this fleet, so a title never becomes a commit subject; only
# the commit prefixes above decide what may ride the docs lane.
lint-title no
