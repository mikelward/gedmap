name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The weekly dependency PR is opened by `GITHUB_TOKEN`, and GitHub does not
  # let a `GITHUB_TOKEN`-created event start a workflow — so `pull_request`
  # never fires for it. `workflow_dispatch` is the documented exception, and
  # `dependency-update.yml` dispatches this workflow against the branch it
  # pushes. Removing this leaves that PR with no CI and nothing to say so.
  workflow_dispatch:

# CI only builds and tests — it never writes to the repository, so it runs with
# a read-only token whatever the repo's default workflow permissions happen to
# be set to. That default is a repository SETTING this file cannot see, so
# read-only is declared here rather than assumed. It matters most on the weekly
# dependency branch, which `dependency-update.yml` dispatches this workflow
# against: those runs execute unreviewed dependency code — `npm ci` lifecycle
# scripts, and the suite loading the packages themselves — and a write-capable
# token there would undo the no-write-token boundary the update job is built
# around.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Do not leave the token in .git/config where dependency
          # code running later in this job could read it back out.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Read the major from .nvmrc rather than repeating it here, so CI,
          # `nvm use`, and engines.node can't drift apart (nodeVersion.test.js
          # asserts the last pair agree).
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
