# Puts the `codex` status back to pending the moment a PR opens or its head
# moves. A commit status belongs to the commit, not the PR, so a PR opened on
# a SHA an earlier PR already earned `codex: success` on inherits that success
# straight away. See scripts/codex-verdict.mjs.
#
# `pull_request_target`, not `pull_request`, and that is the whole point: a
# `pull_request` run executes the PR's *own copy of this file*, so a PR could
# rewrite the request below and use the `statuses: write` token to publish
# `codex: success` for itself — the gate defeated by editing the gate.
# `pull_request_target` runs the definition from the default branch instead.
#
# The standing danger of `pull_request_target` is checking out PR code with a
# write token. This job checks nothing out and runs nothing from the
# repository: the request is fixed, and the only value taken from the event is
# the head SHA. `codex-verdict.test.js` asserts all of that, because the
# safety here is the absence of a checkout rather than anything present.
#
# It also covers forks, which `pull_request` could not — that token is
# read-only, so the fork case previously waited for the scheduled sweep.
name: codex-verdict-reset

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  statuses: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset the codex status to pending
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SLUG: ${{ github.repository }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "authorization: Bearer $TOKEN" \
            -H "accept: application/vnd.github+json" \
            "https://api.github.com/repos/$SLUG/statuses/$SHA" \
            -d '{"context":"codex","state":"pending","description":"Waiting for Codex to review this head"}'
